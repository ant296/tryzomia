<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditeur Web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="controls">
    <button onclick="addText()">Ajouter Texte</button>
    <input type="file" id="fileInput" multiple accept="image/*" onchange="addImage(event)">
</div>

<div id="canvas"></div>

<script>
// 🔒 Mot de passe avant accès
let password = prompt("Entrez le mot de passe pour accéder à la page:");
if(password !== "1234"){ // change le mot de passe ici
    document.body.innerHTML = "<h2>Accès refusé</h2>";
    throw "Accès refusé";
}

let canvas = document.getElementById('canvas');

// Déplacer un élément
function makeDraggable(el) {
    el.onmousedown = function(e) {
        let offsetX = e.clientX - el.offsetLeft;
        let offsetY = e.clientY - el.offsetTop;

        function mouseMoveHandler(e) {
            el.style.left = (e.clientX - offsetX) + 'px';
            el.style.top = (e.clientY - offsetY) + 'px';
        }

        function reset() {
            document.removeEventListener('mousemove', mouseMoveHandler);
            document.removeEventListener('mouseup', reset);
            savePage(); // sauvegarde auto après déplacement
        }

        document.addEventListener('mousemove', mouseMoveHandler);
        document.addEventListener('mouseup', reset);
    }
}

// Ajouter texte
function addText() {
    let text = prompt("Texte à ajouter:");
    if(text) {
        let div = document.createElement('div');
        div.className = 'element';
        div.contentEditable = true;
        div.innerText = text;
        div.style.left = '50px';
        div.style.top = '50px';
        canvas.appendChild(div);
        makeDraggable(div);
        savePage();
    }
}

// Ajouter image
function addImage(event) {
    let files = event.target.files;
    for(let file of files) {
        let reader = new FileReader();
        reader.onload = function(e) {
            let div = document.createElement('div');
            div.className = 'element';
            let img = document.createElement('img');
            img.src = e.target.result;
            div.appendChild(img);
            div.style.left = '50px';
            div.style.top = '50px';
            canvas.appendChild(div);
            makeDraggable(div);
            savePage();
        }
        reader.readAsDataURL(file);
    }
}

// Supprimer élément au double clic
canvas.addEventListener('dblclick', function(e){
    if(e.target.classList.contains('element') || e.target.parentElement.classList.contains('element')){
        let el = e.target.classList.contains('element') ? e.target : e.target.parentElement;
        if(confirm("Supprimer cet élément?")){
            el.remove();
            savePage();
        }
    }
});

// Sauvegarde automatique dans localStorage
function savePage() {
    let html = canvas.innerHTML;
    localStorage.setItem('myWebPage', html);
}

// Charger la page sauvegardée
window.onload = function(){
    let saved = localStorage.getItem('myWebPage');
    if(saved){
        canvas.innerHTML = saved;
        document.querySelectorAll('.element').forEach(makeDraggable);
    }
}
</script>

</body>
</html>
